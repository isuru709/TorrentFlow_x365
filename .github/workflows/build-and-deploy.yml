name: Build, Push, and Update K8s Tag

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrentflow-main-deploy
  cancel-in-progress: false

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    env:
      KUSTOMIZATION_FILE: k8s/overlays/prod/kustomization.yaml
      DEFAULT_DOCR_REGISTRY: registry.digitalocean.com/torrentflow-registry
      DEFAULT_DOCR_REPOSITORY: torrent-downloader

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DOCR_TOKEN }}" || (echo "DOCR_TOKEN is missing" && exit 1)

      - name: Set image variables
        run: |
          REGISTRY="${{ secrets.DOCR_REGISTRY }}"
          REPOSITORY="${{ secrets.DOCR_REPOSITORY }}"

          if [ -z "${REGISTRY}" ]; then
            REGISTRY="${DEFAULT_DOCR_REGISTRY}"
          fi

          if [ -z "${REPOSITORY}" ]; then
            REPOSITORY="${DEFAULT_DOCR_REPOSITORY}"
          fi

          REGISTRY="${REGISTRY//$'\r'/}"
          REGISTRY="${REGISTRY//$'\n'/}"
          REPOSITORY="${REPOSITORY//$'\r'/}"
          REPOSITORY="${REPOSITORY//$'\n'/}"

          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REGISTRY}/${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Ensure kustomization file exists and is not empty
        run: |
          mkdir -p "$(dirname "${KUSTOMIZATION_FILE}")"

          if [ ! -s "${KUSTOMIZATION_FILE}" ]; then
            printf '%s\n' \
              'apiVersion: kustomize.config.k8s.io/v1beta1' \
              'kind: Kustomization' \
              '' \
              'namespace: torrent-downloader' \
              '' \
              'resources:' \
              '  - ../../base' \
              '' \
              'images:' \
              '  - name: torrent-downloader' \
              '    newName: registry.digitalocean.com/torrentflow-registry/torrent-downloader' \
              '    newTag: latest' \
              > "${KUSTOMIZATION_FILE}"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: doctl
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update kustomization image reference
        run: |
          TMP_FILE="$(mktemp)"

          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^([[:space:]]*newName:[[:space:]]*).*$ ]]; then
              printf '%s%s\n' "${BASH_REMATCH[1]}" "${IMAGE_NAME}" >> "$TMP_FILE"
            elif [[ "$line" =~ ^([[:space:]]*newTag:[[:space:]]*).*$ ]]; then
              printf '%s%s\n' "${BASH_REMATCH[1]}" "${IMAGE_TAG}" >> "$TMP_FILE"
            else
              printf '%s\n' "$line" >> "$TMP_FILE"
            fi
          done < "${KUSTOMIZATION_FILE}"

          mv "$TMP_FILE" "${KUSTOMIZATION_FILE}"

      - name: Commit manifest update
        run: |
          if git diff --quiet -- "${KUSTOMIZATION_FILE}"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${KUSTOMIZATION_FILE}"
          git commit -m "ci: set image ${IMAGE_TAG}"
          git push
